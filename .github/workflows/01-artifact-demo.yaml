name: 01-artifact-demo

on:
    workflow_dispatch:

jobs:
    flask-ci-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6
            
            - name: Build Docker Image
              uses: docker/build-push-action@v7
              with:
                context: .
                push: false
                tags: manoj-flask-app:v1.0.1

            - name: Run Container
              run: |
                docker run -d \
                -p 5000:5000 \
                --name manoj-flask-container \
                manoj-flask-app:v1.0.1
            
            - name: Generate Smoke Test Report
              run: |
                sleep 5
                curl http://localhost:5000 > smoke-test-report.txt
                curl http://localhost:5000/health >> smoke-test-report.txt

            - name: Export container logs
              run: |
                docker logs manoj-flask-container > container-logs.txt

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                name: flask-ci-artifacts
                path: |
                    smoke-test-report.txt
                    container-logs.txt
        
    review-job:
        runs-on: ubuntu-latest
        needs:
            - flask-ci-job
        steps:
            - name: download artifacts
              uses: actions/download-artifact@v8
              with:
                name: flask-ci-artifacts
            
            - name: Review download arifacts
              run: |
                echo "===smoke test report==="
                cat smoke-test-report.txt
                echo ""
                echo "====container logs===="
                cat container-logs.txt

