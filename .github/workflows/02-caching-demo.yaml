name: 02-Caching demo
on:
    workflow_dispatch:

jobs:
    build-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repository
              uses: actions/checkout@v5
            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: 3.13
                
            - name: Restore pip cache
              id: pip-cache
              uses: actions/cache@v5
              with:
                path: ~/.cache/pip
                key: pip-cache-${{runner.os}}-${{hashFiles('requirements.txt')}}

            - name: Display cache stats
              run: |
                echo "Cache hit: ${{ steps.pip-cache.outputs.cache-hit }}"
                echo "Cache key: ${{ steps.pip-cache.outputs.cache-key }}"
                echo "Cache path: ${{ steps.pip-cache.outputs.cache-path }}"

            - name: Install Dependencies
              run: |
                pip install -r requirements.txt

    test-job:
        runs-on: ubuntu-latest
        needs:
            - build-job
        
        steps:
            - name: checkout repository
              uses: actions/checkout@v5
            - name: setup python
              uses: actions/setup-python@v5
